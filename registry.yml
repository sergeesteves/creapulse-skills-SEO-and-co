# Manifeste de provenance des skills vendorisés (cf. ROADMAP.md §2).
# Chaque skill copié dans skills/ garde ici sa fiche d'identité.
#
# Champs par skill :
#   source_repo   : repo GitHub d'origine
#   source_path   : chemin du skill dans le repo source
#   source_sha    : commit exact au moment de la copie (base des diffs de veille upstream, sources git)
#   source_type   : (optionnel) git (défaut) | zip — skill distribué en artefact zip, pas en fichier git
#   source_url    : (zip) URL de téléchargement de l'artefact
#   source_version: (zip) version au moment de la copie — remplace source_sha ; veille PAR VERSION, pas par SHA
#   license       : licence du skill source
#   tracking      : tracked (rester proche upstream) | forked-hard (fait nôtre, plus de sync)
#                   | first-party (skill écrit maison — la "source" est notre propre repo canonique)
#   local_changes : liste de nos modifications par rapport à la source
#
# NOTE (à valider par Serge) : la valeur `first-party` étend le schéma initial (tracked|forked-hard)
# pour les skills qu'on écrit nous-mêmes et qu'on publie dans un repo dédié. Pour ceux-là, la veille
# upstream n'a pas de sens : c'est NOUS l'upstream. Ajustable si tu préfères un autre nom.

skills:
  dataforseo:
    source_repo: https://github.com/sergeesteves/dataforseo-mcp-skill
    source_path: skill/
    source_sha: 9aba4de742324e3534e3263c0b4794d41d789d9b
    license: MIT
    tracking: first-party
    local_changes:
      - Aucune (copie conforme du repo dédié à ce sha).
    notes: >
      Playbook cost-aware pour l'API DataForSEO, compagnon du serveur MCP officiel
      (dataforseo-mcp-server). Couvre le choix endpoint + mode (Live/Standard/Labs)
      et les garde-fous de coût (API prépayée). Recoupe partiellement le connecteur
      DataForSEO d'AgriciDaniel/claude-seo (ROADMAP §5.1) — ici c'est un skill de
      décision, pas un connecteur.

  diagram-design:
    source_repo: https://github.com/cathrynlavery/diagram-design
    source_path: skills/diagram-design/
    source_sha: 09df49d8d1a1c7fb2efdfcdc7a2a0713534350a6
    license: MIT
    tracking: tracked
    transform: build/diagram-design/apply.ps1
    local_changes:
      - >
        Charte Creapulse : remap des 12 tokens de couleur (+ variantes rgba) sur l'ensemble
        des références ET des templates de génération — 5 277 occurrences, 118 fichiers.
        Non remappés volontairement : la palette de séries des graphiques multi-séries et
        le skin terminal opt-in, qui sont des registres séparés.
      - >
        SKILL.md §0 réécrite : la porte d'onboarding upstream pose une question à
        l'utilisateur au premier diagramme. Insoluble en exécution non interactive (n8n,
        API). Remplacée par une déclaration de charte active + interdiction explicite de
        questionner, d'appeler l'onboarding réseau ou de sauvegarder un profil.
      - >
        Typographie : les trois rôles (serif / sans / mono) passent en polices SYSTÈME —
        Open Sans (déjà servie par le thème Enfold), pile monospace système, Georgia.
        2 513 occurrences remappées et 107 liens Google Fonts retirés : la skill n'émet
        plus aucun chargement de police, rien à enqueue côté WordPress. La hiérarchie
        upstream (mono = technique, sans = noms, serif = titres) est conservée.
      - >
        Canevas et planchers typographiques : nouveau preset par défaut
        `creapulse-article` (viewBox 720 de large, hauteur dérivée du contenu). Le SVG
        s'affichant en width:100% dans une colonne d'article, dessiner à 1280 le réduisait
        de 44 % — un libellé à 12px sortait à 6,8px à l'écran. À 720, une unité SVG vaut
        un pixel, et le ramp impose 14px minimum pour les libellés, 12px pour les
        légendes. Conséquence assumée : les processus larges passent en vertical.
      - >
        Coût : la section 0 borne aussi la surface d'exploration du modèle. En exécution
        automatisée elle interdit la lecture des références hors-scope (animation, export,
        import drawio/mermaid, onboarding, profiles, primitives terminal/sketchy) — chaque
        fichier lu étant reprocessé à chaque tour de la boucle d'agent, une lecture inutile
        est payée plusieurs fois. Plafond de 3 passes de génération/vérification.
        Gain estime ~-30 % de tokens d'entree par diagramme (a confirmer sur les
        prochains runs ; le poste dominant restant est la boucle de generation Python).
    notes: >
      27 types de diagrammes éditoriaux, sortie HTML/SVG autoportante. Premier skill du
      kit publié vers la Skills API d'Anthropic et consommé depuis n8n (workflow
      `[Référence] Blog · Article + visuels diagram-design`, ID xa7eMUZLZZ9AhyjG).

      IMPORTANT — la copie sous skills/ est CONFORME à l'upstream. Nos modifications ne
      sont pas appliquées dedans : elles vivent dans `transform` et sont rejouées au build.
      C'est ce qui permet de rester `tracked` malgré une modification massive : un bump de
      `source_sha` produit un diff upstream lisible, sans les 5 277 lignes de bruit couleur.
      Ne jamais éditer skills/diagram-design/ à la main.

      NOTE (à valider par Serge) : le champ `transform` étend le schéma. Il distingue
      « skill modifié à la main » (fork dur, diff illisible) de « skill transformé par
      script » (reste suivi). Renommable si tu préfères.

  crawl4ai:
    source_type: zip                                     # artefact zip, pas un fichier git → veille par version
    source_url: https://docs.crawl4ai.com/assets/crawl4ai-skill.zip
    source_repo: https://github.com/unclecode/crawl4ai   # projet upstream (releases = signal de veille)
    source_version: 0.7.4                                # remplace source_sha pour ce type de source
    license: Apache-2.0
    tracking: tracked
    domain: crawl
    path: skills/crawl/crawl4ai
    # Nos ajouts (couche d'accès au serveur SELF-HOSTÉ, absente de l'upstream SDK-only) ont
    # désormais leur MAISON CANONIQUE dans un repo public dédié, séparé de la copie vendorisée
    # ci-dessus. Ce ne sont PAS le même skill : l'upstream enseigne le SDK Python, notre repo
    # documente l'appel au serveur self-hosté (MCP / n8n / REST). Deux provenances, deux veilles.
    additions:
      canonical_repo: https://github.com/sergeesteves/crawl4ai-skill-mcp
      canonical_sha: 9205ba1670db90a0ab5f316981f0efc4674a1b4d
      license: MIT
      tracking: first-party        # notre repo = l'upstream de nos ajouts (pas de veille amont)
      skill_path: skill/           # SKILL.md + references/{mcp,n8n,rest-api,seo-patterns}.md + examples/
      scope: >
        Couche d'accès au serveur Crawl4AI self-hosté (image unclecode/crawl4ai) : 3 voies
        (MCP, nœud n8n n8n-nodes-crawl4ai-plus, REST) + pièges (auth Bearer 0.9 secure-by-default,
        body /crawl {type, params}) + patterns SEO (Markdown BM25, SEO metadata, extraction sans LLM).
    local_changes:
      - >
        AJOUT Creapulse : references/rest-api-and-n8n-creapulse.md dans la copie vendorisée —
        SUPERSEDED par le repo public `crawl4ai-skill-mcp` (cf. bloc `additions`), qui est
        désormais la maison canonique et plus complète (4 fichiers de référence vs 1). Le fichier
        en place reste une empreinte historique ; ne plus l'éditer à la main — faire évoluer nos
        ajouts dans le repo public. Le reste de la copie = conforme au zip upstream v0.7.4.
    notes: >
      Skill OFFICIEL Crawl4AI (unclecode/crawl4ai) : crawling web + extraction structurée
      (AsyncWebCrawler, génération de schéma LLM-free, pages JS, crawl multi-URL). Contenu :
      SKILL.md + references/complete-sdk-reference.md (225 Ko, progressive disclosure)
      + scripts/ (basic/batch/extraction_pipeline) + tests/. ~276 Ko.

      DÉPENDANCE : enseigne le SDK Python — les scripts nécessitent `pip install crawl4ai`
      + `crawl4ai-setup` (Playwright) dans l'environnement d'exécution. Pas de clé API
      (crawler local, open-source). N'utilise PAS l'API REST hébergée (crawl4ai.creapulse.fr)
      — c'est la voie SDK Python, pas le connecteur REST.

      VEILLE (spécifique) : la source est un ZIP versionné (docs.crawl4ai.com/assets/
      crawl4ai-skill.zip), PAS un fichier git → le diff-SHA du kit NE s'applique PAS.
      Suivre le champ `version:` du frontmatter + les releases unclecode/crawl4ai ;
      re-télécharger le zip et diff si bump.

      NOTE (à valider) : `source_type: zip` + `source_url` + `source_version` étendent le
      schéma pour les skills distribués en artefact (zip) plutôt qu'en fichier git.

      NOTE (à valider) : le bloc `additions` étend aussi le schéma. Il sépare la provenance
      AMONT (le skill vendorisé, ici tracked) de la maison canonique de NOS ajouts (un repo
      first-party public). Utile quand nos apports deviennent assez gros pour vivre dans leur
      propre repo plutôt qu'en `local_changes` bricolés dans la copie. Renommable si besoin.
