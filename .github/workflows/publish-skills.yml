name: Publier les skills vers la Skills API

# Publie vers l'API Anthropic les skills (déclenchement MANUEL via workflow_dispatch).
# Les workflows n8n qui demandent version:"latest" suivent sans modification.
#
# Prérequis : secret de dépôt ANTHROPIC_API_KEY.
# Gate MANUEL au démarrage (on valide chaque publication à la main). Pour rebasculer en
# publication automatique sur push, ré-ajouter le bloc `push:` ci-dessous (cf. ROADMAP §9).

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Nom du skill à publier (vide = tous les skills présents)"
        required: false
        type: string
      dry_run:
        description: "Construire sans publier"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # l'étape de réinjection commite/pushe build/skill-ids.json

concurrency:
  group: publish-skills
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Déterminer les skills à publier
        id: cibles
        shell: pwsh
        run: |
          $manuel = '${{ inputs.skill }}'.Trim()

          if ($manuel) {
            # Un skill précis demandé dans l'input.
            $skills = @($manuel)
          } else {
            # Sans skill précisé : on publie tous les skills présents (skills/*/SKILL.md).
            $skills = Get-ChildItem skills -Directory |
              Where-Object { Test-Path (Join-Path $_.FullName 'SKILL.md') } |
              ForEach-Object { $_.Name } | Sort-Object -Unique
          }

          if (-not $skills) {
            Write-Host "Aucun skill trouve."
          } else {
            Write-Host "A publier : $($skills -join ', ')"
          }
          "liste=$($skills -join ',')" >> $env:GITHUB_OUTPUT

      - name: Publier
        if: steps.cibles.outputs.liste != ''
        shell: pwsh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          $dry = '${{ inputs.dry_run }}' -eq 'true'
          $echecs = @()

          foreach ($s in '${{ steps.cibles.outputs.liste }}'.Split(',')) {
            Write-Host "::group::$s"
            try {
              if ($dry) {
                ./build/publish-skill.ps1 -Skill $s -DryRun
              } else {
                ./build/publish-skill.ps1 -Skill $s
              }
            } catch {
              Write-Host "::error title=Publication $s::$_"
              $echecs += $s
            }
            Write-Host "::endgroup::"
          }

          if ($echecs) { throw "Echec de publication : $($echecs -join ', ')" }

      # Le skill_id est un identifiant, pas un secret : on le renvoie dans le repo
      # pour que les publications suivantes ajoutent une version au lieu d'en créer un autre.
      - name: Réinjecter les skill_id découverts
        if: steps.cibles.outputs.liste != '' && inputs.dry_run != true
        shell: bash
        run: |
          if git diff --quiet -- build/skill-ids.json; then
            echo "Aucun nouveau skill_id."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/skill-ids.json
          git commit -m "build: enregistre les skill_id Anthropic [skip ci]"
          git push
